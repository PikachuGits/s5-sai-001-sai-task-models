# Test-only PostgreSQL 16; credentials are throwaway values, never real ones.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: clawhunt
      POSTGRES_DB: clawhunt_1834_test
      POSTGRES_HOST_AUTH_METHOD: trust
      TZ: UTC
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clawhunt -d clawhunt_1834_test"]
      interval: 5s
      timeout: 3s
      retries: 10
